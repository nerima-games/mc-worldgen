name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Fork PRs don't need GITHUB_TOKEN to survive past this step; nothing
          # later pushes anything (SUPPLY_CHAIN.md, "アクションの固定").
          persist-credentials: false
          # `pnpm changeset status --since=main` below needs the history and
          # the main ref to diff against; the default shallow (depth-1) clone
          # cannot answer "what changed since main".
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Catches a user-facing PR that forgot `pnpm changeset` (RELEASE_STANDARD.md
      # §1.2). Only meaningful on a PR — `--since=main` against main itself is a
      # no-op — so this step does not run on push.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=main

      - name: Test
        run: pnpm test

      # Separate from `pnpm verify` on purpose (TEST_STANDARD.md §1/§3): this
      # is the 4-metric (branches/functions/lines/statements) 99% gate from
      # vitest.config.ts, enabled org-wide with no phase-in. Known to be red
      # here today — see docs/testing.md and the migration PR description for
      # the real, measured numbers.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
