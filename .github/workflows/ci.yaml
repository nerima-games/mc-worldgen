name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PRs don't need GITHUB_TOKEN to survive past this step; nothing
          # later pushes anything (SUPPLY_CHAIN.md, "アクションの固定").
          persist-credentials: false
          # `pnpm changeset status --since=main` below needs the history and
          # the main ref to diff against; the default shallow (depth-1) clone
          # cannot answer "what changed since main".
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the org-wide trade-off (DEPENDENCY_POLICY.md §5
      # "前提条件"): one pinned oxlint version instead of 16 repos each
      # independently drifting on their own npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # oxlint's no-restricted-imports (.oxlintrc.json) is the enforcement
      # mechanism for the Tier dependency policy (DEPENDENCY_POLICY.md §5).
      - name: Lint
        run: nix develop --command pnpm lint

      # Catches a user-facing PR that forgot `pnpm changeset` (RELEASE_STANDARD.md
      # §1.2). Only meaningful on a PR — `--since=main` against main itself is a
      # no-op — so this step does not run on push.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=main

      - name: Test
        run: pnpm test

      # Separate from `pnpm verify` on purpose (TEST_STANDARD.md §1/§3): this
      # is the 4-metric (branches/functions/lines/statements) 99% gate from
      # vitest.config.ts, enabled org-wide with no phase-in. Known to be red
      # here today — see docs/testing.md and the migration PR description for
      # the real, measured numbers.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
