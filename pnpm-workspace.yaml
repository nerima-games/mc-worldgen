allowBuilds:
  # esbuild is no longer a direct devDependency (the build switched to tsc
  # emit), but vite (a transitive dependency of vitest 4) still depends on
  # it, so its install script still needs an explicit allow decision.
  esbuild: true
minimumReleaseAgeExclude:
  - '@nerima-games/mc-kernel@0.2.8 || 0.2.17 || 0.4.0'
  - '@nerima-games/mc-noise@0.3.0'
  - '@nerima-games/mc-save@0.3.0'
overrides:
  # GHSA-2v37-7h3g-55p8: nanoid can loop indefinitely when a custom generator
  # receives size 0. Pulled in transitively via vitest 4's vite -> postcss ->
  # nanoid chain (`pnpm why nanoid`); this repository does not call nanoid
  # directly.
  nanoid: '>=3.3.18'
