allowBuilds:
  # esbuild is no longer a direct devDependency (the build switched to tsc
  # emit), but vite (a transitive dependency of vitest 4) still depends on
  # it, so its install script still needs an explicit allow decision.
  esbuild: true
minimumReleaseAgeExclude:
  # These published pins are consumed immediately to complete the coordinated
  # kernel/noise/save migration before the release-age window expires.
  - '@nerima-games/mc-kernel@0.2.8 || 0.2.17 || 0.4.0 || 0.5.1 || 0.7.0 || 0.8.0 || 0.9.0 || 0.11.0'
  - '@nerima-games/mc-noise@0.3.0 || 0.3.1 || 0.4.0 || 0.5.0'
  - '@nerima-games/mc-save@0.3.0 || 0.4.1 || 0.5.0 || 0.6.0'
overrides:
  # GHSA-2v37-7h3g-55p8: nanoid can loop indefinitely when a custom generator
  # receives size 0. Pulled in transitively via vitest 4's vite -> postcss ->
  # nanoid chain (`pnpm why nanoid`); this repository does not call nanoid
  # directly.
  nanoid: '>=3.3.18'
  # Keep Vitest 5's mocker aligned while applying patched transitive releases.
  '@vitest/mocker': '5.0.5'
  source-map-js: '1.2.2'
  vite: '7.3.7'
  # @changesets/cli 3.0.3 still resolves vulnerable releases through this chain.
  launch-editor: '2.14.2'
  shell-quote: '1.11.0'
